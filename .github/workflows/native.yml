# Native engine: Android dependency superbuild (cached and resumable),
# libslic3r + orca_engine, and an APK that bundles the engine.
name: Native engine

# Every push: the APK bundles the engine, so any change to the app needs this
# build to produce one. The caches keep runs without engine changes short.
on:
  push:
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ORCA_API: "29"
  DEPS_BUILD_DIR: /home/runner/orca-deps-build
  DEPS_PREFIX: /home/runner/orca-deps-prefix

jobs:
  engine:
    name: Dependencies, engine and APK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        # arm64-v8a ships to phones; x86_64 runs on the CI emulator.
        abi: [arm64-v8a, x86_64]
    # Not named ABI: autotools packages (GMP) read an ABI environment variable.
    env:
      ORCA_ABI: ${{ matrix.abi }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h "${GITHUB_WORKSPACE}"

      # Headroom for the heaviest engine sources; a runner that runs out of
      # memory is killed without a log.
      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /mnt/orca-swap
          sudo chmod 600 /mnt/orca-swap
          sudo mkswap /mnt/orca-swap
          sudo swapon /mnt/orca-swap
          free -h

      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 1

      # The settings screen's layout is generated from upstream's Tab.cpp; it must
      # match the pinned engine.
      - name: Check the settings layout matches the pinned OrcaSlicer
        run: |
          pin="$(git -C third_party/OrcaSlicer rev-parse --short=12 HEAD)"
          python3 tools/extract_tab_layout.py third_party/OrcaSlicer/src/slic3r/GUI/Tab.cpp "${RUNNER_TEMP}/layout.json" "${pin}"
          diff -u feature/settings/src/main/assets/settings_layout.json "${RUNNER_TEMP}/layout.json" || {
            echo "::error::feature/settings/src/main/assets/settings_layout.json is out of date. Run: python3 tools/extract_tab_layout.py third_party/OrcaSlicer/src/slic3r/GUI/Tab.cpp feature/settings/src/main/assets/settings_layout.json ${pin}"
            exit 1
          }

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build autoconf automake libtool ccache

      - name: Select NDK and engine pin
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME}"
          rev="$(sed -n 's/^Pkg.Revision *= *//p' "${ndk}/source.properties")"
          echo "Using NDK ${rev} at ${ndk}"
          echo "ANDROID_NDK_HOME=${ndk}" >> "${GITHUB_ENV}"
          echo "NDK_REVISION=${rev}" >> "${GITHUB_ENV}"
          echo "ORCA_PIN=$(git rev-parse --short=12 HEAD:third_party/OrcaSlicer)" >> "${GITHUB_ENV}"

      # The prefix is restored from the newest matching cache, even one saved by a
      # run that failed half-way: finished dependencies carry markers and are skipped.
      - name: Restore dependency prefix
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DEPS_PREFIX }}
          key: deps-${{ env.ORCA_ABI }}-${{ env.NDK_REVISION }}-${{ env.ORCA_PIN }}-${{ hashFiles('deps/**') }}-${{ github.sha }}
          # Any earlier prefix for this ABI, NDK and engine pin: per-dependency
          # markers decide what is still current.
          restore-keys: |
            deps-${{ env.ORCA_ABI }}-${{ env.NDK_REVISION }}-${{ env.ORCA_PIN }}-

      - name: Build dependencies
        run: >
          ci/run_step.sh deps deps/scripts/build_deps.sh
          --abi "${ORCA_ABI}" --api "${ORCA_API}" --build-dir "${DEPS_BUILD_DIR}" --prefix "${DEPS_PREFIX}"

      - name: Save dependency prefix
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DEPS_PREFIX }}
          key: deps-${{ env.ORCA_ABI }}-${{ env.NDK_REVISION }}-${{ env.ORCA_PIN }}-${{ hashFiles('deps/**') }}-${{ github.sha }}

      - name: Free dependency build tree
        run: rm -rf "${DEPS_BUILD_DIR}"

      # Compiler cache for the engine sources: a run that changes only the bridge
      # or one upstream file recompiles that, not all of libslic3r.
      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ env.ORCA_ABI }}-${{ env.NDK_REVISION }}-${{ github.sha }}
          restore-keys: ccache-${{ env.ORCA_ABI }}-${{ env.NDK_REVISION }}-

      - name: Configure compiler cache
        run: |
          echo "CCACHE_DIR=/home/runner/.ccache" >> "${GITHUB_ENV}"
          echo "CCACHE_MAXSIZE=3G" >> "${GITHUB_ENV}"
          # Build directories differ between the CMake and Gradle builds.
          echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"
          echo "CCACHE_NOHASHDIR=true" >> "${GITHUB_ENV}"

      - name: Build the engine and the on-device CLI harness (plain CMake)
        run: |
          ci/run_step.sh engine-cli bash -c '
            cmake -S native -B "${RUNNER_TEMP}/native-cli" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="${ORCA_ABI}" -DANDROID_PLATFORM="android-${ORCA_API}" -DANDROID_STL=c++_shared \
              -DORCA_DEPS_PREFIX="${DEPS_PREFIX}" \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DORCA_MAX_COMPILE_JOBS=3 &&
            cmake --build "${RUNNER_TEMP}/native-cli" --target orca_slice_cli orca_engine'

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ env.ORCA_ABI }}-${{ env.NDK_REVISION }}-${{ github.sha }}

      # Stripped copies of the engine (packaged into the APK below, rather than
      # compiling it a second time through Gradle) and of the CLI harness; the
      # NDK compiles with -g even for Release, which makes them gigabytes. The
      # build tree goes afterwards: the runner's disk cannot hold it and Gradle's.
      - name: Collect the engine, the CLI harness and its C++ runtime
        run: |
          case "${ORCA_ABI}" in
            arm64-v8a) triple=aarch64-linux-android ;;
            x86_64) triple=x86_64-linux-android ;;
          esac
          toolchain="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64"
          libcxx="${toolchain}/sysroot/usr/lib/${triple}/libc++_shared.so"
          libs="${RUNNER_TEMP}/engine-libs/${ORCA_ABI}"
          bundle="${RUNNER_TEMP}/cli-bundle"
          mkdir -p "${libs}" "${bundle}"
          "${toolchain}/bin/llvm-strip" --strip-debug -o "${libs}/liborca_engine.so" "${RUNNER_TEMP}/native-cli/bridge/liborca_engine.so"
          "${toolchain}/bin/llvm-strip" --strip-debug -o "${bundle}/orca_slice_cli" "${RUNNER_TEMP}/native-cli/bridge/orca_slice_cli"
          cp "${libcxx}" "${libs}/"
          cp "${libcxx}" "${bundle}/"
          # A profile subset for the on-device preset test: one vendor and the
          # filament library it inherits from.
          tar -C third_party/OrcaSlicer/resources -czf "${bundle}/test-profiles.tar.gz" \
              --exclude='*.png' --exclude='*.stl' --exclude='*.svg' \
              profiles/Creality.json profiles/Creality profiles/OrcaFilamentLibrary.json profiles/OrcaFilamentLibrary
          ls -l "${libs}" "${bundle}"
          rm -rf "${RUNNER_TEMP}/native-cli"
          df -h /

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK with the native engine
        run: >
          ci/run_step.sh engine-apk ./gradlew --stacktrace :app:assembleDebug :core:engine:assembleDebugAndroidTest
          -Porca.native=true -Porca.depsPrefix="${DEPS_PREFIX}" -Porca.abis="${ORCA_ABI}"
          -Porca.ndkVersion="${NDK_REVISION}" -Porca.prebuiltEngineDir="${RUNNER_TEMP}/engine-libs"
          -Porca.versionCode="${{ github.run_number }}"
          -Porca.updateTag="${{ github.ref_name == 'main' && 'latest-build' || format('{0}-build', github.ref_name) }}"

      - name: Check 16 KB page alignment
        run: |
          so="$(find app/build -name liborca_engine.so | head -n1)"
          echo "Checking ${so}"
          "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -lW "${so}" | awk '/LOAD/ {print; if ($NF != "0x4000") bad=1} END {exit bad}'

      - name: Upload APK with engine
        uses: actions/upload-artifact@v4
        with:
          name: orca-mobile-debug-${{ env.ORCA_ABI }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload engine device tests
        uses: actions/upload-artifact@v4
        with:
          name: engine-device-tests-${{ env.ORCA_ABI }}
          path: core/engine/build/outputs/apk/androidTest/debug/*.apk

      - name: Upload CLI harness
        uses: actions/upload-artifact@v4
        with:
          name: orca_slice_cli-${{ env.ORCA_ABI }}
          path: ${{ runner.temp }}/cli-bundle/

  emulator-smoke:
    name: Slice on an Android emulator (x86_64)
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@v4
        with:
          name: orca_slice_cli-x86_64
          path: smoke

      - uses: actions/download-artifact@v4
        with:
          name: orca-mobile-debug-x86_64
          path: smoke

      - uses: actions/download-artifact@v4
        with:
          name: engine-device-tests-x86_64
          path: smoke/device-tests

      - name: Run the engine and the app on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ci/run_step.sh emulator-smoke ci/emulator_smoke_test.sh smoke

      - name: Upload smoke-test G-code
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-gcode-x86_64
          path: smoke/*.gcode
          if-no-files-found: ignore

  # Builds from main that passed the emulator test go to one rolling pre-release,
  # so a phone can always install the latest from a fixed link:
  # https://github.com/<owner>/<repo>/releases/download/latest-build/orca-mobile-arm64-v8a.apk
  # A milestone branch (milestone-N) publishes to its own, milestone-N-build; its
  # builds update from there until the release is deleted on merging into main.
  publish:
    name: Publish the latest build
    needs: [engine, emulator-smoke]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/milestone-')) && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 30   # for the changes listed in version.json

      - uses: actions/download-artifact@v4
        with:
          pattern: orca-mobile-debug-*
          path: apks

      - name: Update the latest-build release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name == 'main' && 'latest-build' || format('{0}-build', github.ref_name) }}
          TITLE: ${{ github.ref_name == 'main' && 'Latest build' || format('Latest {0} build', github.ref_name) }}
        run: |
          set -euo pipefail
          mkdir -p out
          for abi in arm64-v8a x86_64; do
            cp "$(ls apks/orca-mobile-debug-${abi}/*.apk | head -n 1)" "out/orca-mobile-${abi}.apk"
          done
          ls -l out
          git tag -f "${TAG}" "${GITHUB_SHA}"
          git push -f origin "refs/tags/${TAG}"
          notes="Latest build of ${GITHUB_REF_NAME}: ${GITHUB_SHA::7}, CI run #${GITHUB_RUN_NUMBER}, $(date -u '+%Y-%m-%d %H:%M UTC').

          Phones: install orca-mobile-arm64-v8a.apk. The x86_64 file is for emulators.
          This is a test build, signed with the project's debug key; later builds install over it."
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --prerelease --title "${TITLE}" --notes "${notes}"
          else
            gh release create "${TAG}" --prerelease --title "${TITLE}" --notes "${notes}" --verify-tag
          fi
          # What the app's update check reads (core/update): this build's versionCode is the
          # run number (app/build.gradle.kts), and the latest commits say what changed.
          python3 - <<PY
          import json, subprocess
          subjects = subprocess.run(["git", "log", "-10", "--format=%s"], capture_output=True, text=True).stdout.splitlines()
          json.dump({
              "versionCode": int("${GITHUB_RUN_NUMBER}"),
              "commit": "${GITHUB_SHA}",
              "builtAt": "$(date -u '+%Y-%m-%dT%H:%M:%SZ')",
              "changes": [s for s in subjects if s][:10],
              "apks": {"arm64-v8a": "orca-mobile-arm64-v8a.apk", "x86_64": "orca-mobile-x86_64.apk"},
          }, open("out/version.json", "w"), indent=2)
          PY
          cat out/version.json
          gh release upload "${TAG}" out/*.apk out/version.json --clobber
